<!DOCTYPE html>
<html>
    <html lang="eng">
        <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
            <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
            <title>Payment</title>
            <style>
                body{
                    background-color: black;
                }
                .form-group{
                    display: flex;
                    flex-direction: column;
                }
                .checkout-box{
                    background: #fff;
                    padding: 20px 30px;
                    border-radius: 10px;
                    width: 500px;
                    display: grid;
                    grid-template-columns: 1fr 1fr;
                    gap: 20px;
                    font-family: Arial, Helvetica, sans-serif;
                    background-color: white;
                    justify-content: center;
                    align-items: center;
                    margin-left: 400px;
                }
                .cards{
                    display: flex;
                    gap: 5px;
                    margin-top: 10px;
                }
                .cards img{
                    height: 25px;
                }
                .button{
                  grid-column: span 2;
                  text-align: center;
                }
                .button button{
                    background-color: skyblue;
                    color: white;
                    padding: 12px;
                    width: 100%;
                    border: none;
                    border-radius: 5px;
                    font-size: 16px;
                    cursor: pointer;
                }
                .form-group input, .form-group select{
                    padding: 8px;
                    border: 1px solid #ccc;
                    border-radius: 4px;
                    font-size: 14px;
                }
            </style>
        </head>
        <body>
            <nav class="bg-dark p-2 d-flex">
                <a href="CP2.html" class="text-white me-3 text-decoration-none">Home</a>
                <a href="Post.html" class="text-white me-3 text-decoration-none">Post</a>
            </nav>
            <form class="checkout-box">
                <h3>Post</h3>
                <div class="form-group">
                    <label>Title</label>
                    <input type="text" placeholder="Enter your Title">
                </div>
                </div>
                <div class="form-group">
                    <label>Content</label>
                    <textarea rows="5"></textarea>
                </div>
                <div class="form-group">
                    <label>Date</label>
                    <input type="date">
                </div>
                <div class="form-group">
                    <label>Choose file</label>
                    <input type="file">
                </div>
                <div class="button">
                    <button type="submit">Submit</button>
                </div>
            </form>
        </body>
</html>
