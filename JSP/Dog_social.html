<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dog Social</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
  <style>
    body{
      font-family: 'Roboto', sans-serif;
    }
  </style>
</head>
<body style="background-color: black;">
  <nav class="bg-dark p-2 d-flex">
    <a href="#" class="text-white me-3 text-decoration-none">Home</a>
    <a href="#" class="text-white me-3 text-decoration-none">About Me</a>
    <a href="#"  class="text-white text-decoration-none">Login</a>
  </nav>
  <div class="container-fluid">
    <div class="row">
      <div class="col-2 bg-secondary text-white p-3 sidebar">
        <h2>Profile</h2>
    <ul>
      <li>Dashboard</li>
      <li>My Pets</li>
      <li>Preferences</li>
    </ul>
    <img width="100%" src="https://thf.bing.com/th/id/OIP.8zOgG1VsboKY9c_VMcYUCAAAAA?w=115&h=180&c=7&r=0&o=7&cb=thfc1&dpr=1.3&pid=1.7&rm=3" alt="Ad Banner">
      </div>

      <div class="col-8">
        <div style="background-color: bisque;" class="card mx-auto">
          <img width="200px" src="https://thaka.bing.com/th/id/OIP.4h8xQZXkjf06TqZSjcyuGgHaHQ?w=173&h=180&c=7&r=0&o=7&cb=thfc1&dpr=1.3&pid=1.7&rm=3">
          <div class="card-body">
            <h5>Pibble</h5>
            <p class="card-text">Likes cuddling, toys and food</p>
            <div>
              <a href="#"><i class="bi bi-hand-thumbs-up">Like</i></a>
              <a href="#"><i class="bi-bi-share">Share</i></a>
              <a href="#"><i class="bi bi-chat-dots">Comment</i></a>
            </div>
          </div>
        </div>

        <div style="background-color: bisque;" class="card mx-auto">
          <img width="200px" src="https://thf.bing.com/th/id/OIP.kAMCjX7G_1inCivhWgX_7QHaHN?w=159&h=180&c=7&r=0&o=7&cb=thfc1&dpr=1.3&pid=1.7&rm=3">
          <div class="card-body">
            <h5>Golden Retriever</h5>
            <p class="card-text">Playful, likes going outside and loyal</p>
            <div class="d-flex gap-3">
              <a href="#"><i class="bi bi-hand-thumbs-up">Like</i></a>
              <a href="#"><i class="bi-bi-share">Share</i></a>
              <a href="#"><i class="bi bi-chat-dots">Comment</i></a>
            </div>
          </div>
        </div>
        
    </div>
    <div class="col-2 bg-secondary text-white p-3 sidebar min-vh-100">
      <h3>Pet Resources</h3>
    <ul>
      <li>Find a Vet</li>
      <li>Best Treats</li>
      <li>Pet Stores</li>
    </ul>
    <div class="ad">
      <img width="100%" src="https://thf.bing.com/th/id/OIP.8zOgG1VsboKY9c_VMcYUCAAAAA?w=115&h=180&c=7&r=0&o=7&cb=thfc1&dpr=1.3&pid=1.7&rm=3" alt="Ad Banner">
    </div>
  </div>
</body>
</html>
