<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Billing Address</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: beige;
    }

    h2 {
      text-align: center;
    }

    .container {
      background-color: white;
      width: 600px;
      margin: 30px auto;
      padding: 20px;
      border-radius: 10px;
      background: linear-gradient(to bottom left, #d4dbaa, #d0c5c5);
      mix-blend-mode: multiply;
    }

    form {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px 20px;
    }

    label {
      font-weight: bold;
      display: block;
      margin-bottom: 5px;
    }

    input, select {
      width: 100%;
      padding: 6px;
      border: 1px solid black;
      border-radius: 4px;
    }

    button {
      grid-column: 1 / span 2;
      background-color: rgb(227, 234, 237);
      border: none;
      padding: 10px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 16px;
      margin-top: 10px;
    }
    #button {
      grid-column: 1 / span 2;
      background-color: rgb(227, 234, 237);
      border: none;
      padding: 10px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 16px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>Billing Address</h2>
    <form>
      <div>
        <label>Fullname</label>
        <input type="text" placeholder="Enter your fullname">
      </div>

      <div>
        <label>Email</label>
        <input type="email" placeholder="Enter your email">
      </div>

      <div>
        <label>Name on Card</label>
        <input type="text" placeholder="Enter your name on card">
      </div>

      <div>
        <label>Address</label>
        <input type="text" placeholder="Enter your address">
      </div>

      <div>
        <label>Credit Card Number</label>
        <input type="text" placeholder="1234 5678 9011 2233">
      </div>

      <div>
        <label>City</label>
        <input type="text" placeholder="Enter your city">
      </div>

      <div>
        <label>Expiry Month</label>
        <select>
          <option>Select Month</option>
          <option>01</option>
          <option>02</option>
          <option>03</option>
          <option>04</option>
          <option>05</option>
          <option>06</option>
          <option>07</option>
          <option>08</option>
          <option>09</option>
          <option>10</option>
          <option>11</option>
          <option>12</option>
        </select>
      </div>

      <div>
        <label>State</label>
        <input type="text" placeholder="Enter your state">
      </div>

      <div>
        <label>Expiry Year</label>
        <select>
          <option>Select Year</option>
          <option>2025</option>
          <option>2026</option>
          <option>2027</option>
        </select>
      </div>

      <div>
        <label>Zip Code</label>
        <input type="text" placeholder="Enter your zip code">
      </div>

      <div>
        <label>CVV</label>
        <input type="text" placeholder="123">
      </div>

      <button type="submit">Proceed to Checkout</button>
      
    </form>
    <a href="DCK.html"><button id="button">Return</button></a>
  </div>

</body>
</html>
